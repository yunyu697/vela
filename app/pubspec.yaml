name: vela
description: Vela — cross-platform sing-box & mihomo client with guided configuration.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 设计决策：零原生插件依赖（存储用纯 Dart KvStore，见 core/storage/kv_store.dart），
  # 桌面端无需 CocoaPods，移动端减少原生插件链路
  yaml: ^3.1.4
  # 桌面端 Go 桥接 FFI（移动端走 gomobile 平台通道，不用本依赖）
  ffi: ^2.1.4
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
